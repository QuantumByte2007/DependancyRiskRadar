name: CI — Security & Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # Stage 2a — Python SAST (Bandit)
  # ─────────────────────────────────────────
  sast-python:
    name: SAST · Bandit (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit
        # --exit-zero: never fails the job — report is informational only.
        # Promote to fail by removing --exit-zero once the codebase is clean.
        run: |
          bandit -r dependency-risk-radar/backend/ \
            -ll -ii \
            --exit-zero \
            --format json \
            -o bandit-report.json

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  # ─────────────────────────────────────────
  # Stage 2b — JS/TS SAST (ESLint)
  # ─────────────────────────────────────────
  sast-js:
    name: SAST · ESLint (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: dependency-risk-radar/frontend/package-lock.json

      - name: Install dependencies
        working-directory: dependency-risk-radar/frontend
        run: npm ci

      - name: Run ESLint
        working-directory: dependency-risk-radar/frontend
        # --max-warnings=20 allows some warnings while the codebase is being cleaned up.
        # Tighten to 0 once ESLint issues are resolved.
        run: npx eslint src/ --max-warnings=20

  # ─────────────────────────────────────────
  # Stage 2c — Secrets scan (Gitleaks)
  # ─────────────────────────────────────────
  secrets-scan:
    name: Secrets · Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────
  # Stage 3a — Python dependency audit
  # ─────────────────────────────────────────
  sca-python:
    name: SCA · pip-audit (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        # All 3 are starlette transitive CVEs — FastAPI 0.115.0 pins starlette<0.40.0,
        # so these cannot be fixed without a FastAPI upgrade. Revisit when FastAPI 0.116+ ships.
        run: >
          pip-audit -r dependency-risk-radar/backend/requirements.txt --strict
          --ignore-vuln CVE-2024-47874
          --ignore-vuln CVE-2025-54121
          --ignore-vuln PYSEC-2026-161

  # ─────────────────────────────────────────
  # Stage 3b — Node dependency audit
  # ─────────────────────────────────────────
  sca-node:
    name: SCA · npm audit (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: dependency-risk-radar/frontend/package-lock.json

      - name: Install dependencies
        working-directory: dependency-risk-radar/frontend
        run: npm ci

      - name: Audit Node dependencies
        working-directory: dependency-risk-radar/frontend
        run: npm audit --audit-level=high

  # ─────────────────────────────────────────
  # Stage 4 — Build Docker images & run tests
  # ─────────────────────────────────────────
  build-and-test:
    name: Build · Docker + Tests
    runs-on: ubuntu-latest
    needs: [sast-python, sast-js, secrets-scan, sca-python, sca-node]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r dependency-risk-radar/backend/requirements.txt

      - name: Run pytest with coverage
        working-directory: dependency-risk-radar/backend
        env:
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: sqlite:///./test.db
        run: |
          pip install pytest pytest-cov httpx
          pytest tests/ \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=60 \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: dependency-risk-radar/backend/coverage.xml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./dependency-risk-radar/backend
          push: false
          tags: drr-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/drr-backend.tar

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./dependency-risk-radar/frontend
          push: false
          tags: drr-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/drr-frontend.tar

      - name: Save images as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: /tmp/drr-*.tar
          retention-days: 1

  # ─────────────────────────────────────────
  # Stage 5 — Container image CVE scan (Trivy)
  # ─────────────────────────────────────────
  container-scan:
    name: Container scan · Trivy
    runs-on: ubuntu-latest
    needs: [build-and-test]

    steps:
      - uses: actions/checkout@v4

      - name: Download built images
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp/

      - name: Load Docker images
        run: |
          docker load --input /tmp/drr-backend.tar
          docker load --input /tmp/drr-frontend.tar

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: drr-backend:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: drr-frontend:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

  # ─────────────────────────────────────────
  # Stage 6 — Send pipeline logs to Loki
  # ─────────────────────────────────────────
  send-logs-to-loki:
    name: Observability · Push logs to Loki
    runs-on: ubuntu-latest
    if: always()
    needs:
      - sast-python
      - sast-js
      - secrets-scan
      - sca-python
      - sca-node
      - build-and-test
      - container-scan

    steps:
      - name: Push pipeline results to Loki
        env:
          LOKI_URL: ${{ secrets.LOKI_URL }}
        run: |
          TIMESTAMP=$(date +%s%N)

          curl -s -X POST "${LOKI_URL}/loki/api/v1/push" \
            -H "Content-Type: application/json" \
            -d "{
              \"streams\": [
                {
                  \"stream\": {
                    \"job\":      \"github-actions\",
                    \"pipeline\": \"ci\",
                    \"repo\":     \"${{ github.repository }}\",
                    \"branch\":   \"${{ github.ref_name }}\",
                    \"event\":    \"${{ github.event_name }}\"
                  },
                  \"values\": [
                    [
                      \"${TIMESTAMP}\",
                      \"{\\\"run_id\\\": \\\"${{ github.run_id }}\\\", \\\"run_number\\\": \\\"${{ github.run_number }}\\\", \\\"commit\\\": \\\"${{ github.sha }}\\\", \\\"actor\\\": \\\"${{ github.actor }}\\\", \\\"sast_python\\\": \\\"${{ needs.sast-python.result }}\\\", \\\"sast_js\\\": \\\"${{ needs.sast-js.result }}\\\", \\\"secrets_scan\\\": \\\"${{ needs.secrets-scan.result }}\\\", \\\"sca_python\\\": \\\"${{ needs.sca-python.result }}\\\", \\\"sca_node\\\": \\\"${{ needs.sca-node.result }}\\\", \\\"build_and_test\\\": \\\"${{ needs.build-and-test.result }}\\\", \\\"container_scan\\\": \\\"${{ needs.container-scan.result }}\\\"}\"
                    ]
                  ]
                }
              ]
            }"
