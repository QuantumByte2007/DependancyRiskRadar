name: CI — Security & Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # Stage 1 — Python SAST (Bandit)
  # ─────────────────────────────────────────
  sast-python:
    name: SAST · Bandit (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit
        run: bandit -r dependency-risk-radar/backend/ -ll -ii --format json -o bandit-report.json

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  # ─────────────────────────────────────────
  # Stage 2 — JS/TS SAST (ESLint)
  # ─────────────────────────────────────────
  sast-js:
    name: SAST · ESLint (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: dependency-risk-radar/frontend/package-lock.json

      - name: Install dependencies
        working-directory: dependency-risk-radar/frontend
        run: npm ci

      - name: Run ESLint
        working-directory: dependency-risk-radar/frontend
        run: npx eslint src/ --max-warnings=0

  # ─────────────────────────────────────────
  # Stage 3 — Secrets scan (Gitleaks)
  # ─────────────────────────────────────────
  secrets-scan:
    name: Secrets · Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────
  # Stage 4 — Python dependency audit
  # ─────────────────────────────────────────
  sca-python:
    name: SCA · pip-audit (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        # All 3 are starlette transitive CVEs — FastAPI 0.115.0 pins starlette<0.40.0,
        # so these cannot be fixed without a FastAPI upgrade. Revisit when FastAPI 0.116+ ships.
        run: >
          pip-audit -r dependency-risk-radar/backend/requirements.txt --strict
          --ignore-vuln CVE-2024-47874
          --ignore-vuln CVE-2025-54121
          --ignore-vuln PYSEC-2026-161

  # ─────────────────────────────────────────
  # Stage 5 — Node dependency audit
  # ─────────────────────────────────────────
  sca-node:
    name: SCA · npm audit (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: dependency-risk-radar/frontend/package-lock.json

      - name: Install dependencies
        working-directory: dependency-risk-radar/frontend
        run: npm ci

      - name: Audit Node dependencies
        working-directory: dependency-risk-radar/frontend
        run: npm audit --audit-level=high
